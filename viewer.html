<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comic Viewer</title>
<style>
  :root{
    --bg:#12151c;
    --bg2:#1b1f29;
    --ink:#f2f4f8;
    --muted:#9aa3b2;
    --accent:#ce1126;
    --accent2:#ffc72c;
    --btn:rgba(255,255,255,.10);
    --btn-hover:rgba(255,255,255,.20);
    --ease:cubic-bezier(.22,.61,.36,1);
    --dur:750ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

  /* ---------- stage ---------- */
  #stage{
    position:relative;flex:1 1 auto;overflow:hidden;
    touch-action:pan-y;
    cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    position:absolute;left:0;top:0;transform-origin:0 0;
    will-change:transform;
    transition:transform var(--dur) var(--ease);
  }
  #page{
    display:block;width:100%;height:100%;
    border-radius:2px;
    background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.55);
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  #spot{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;opacity:0;transition:opacity 300ms var(--ease);
  }
  #spot.on{opacity:1}
  /* smooth mask travel while sweeping the mouse across the full-page view */
  #spot.smooth #spothole{
    transition:x 260ms var(--ease), y 260ms var(--ease),
               width 260ms var(--ease), height 260ms var(--ease);
  }

  /* ---------- full-page hotspots ----------
     Deliberately invisible: the full page reads as clean artwork. Outline and
     number only appear for the panel under the pointer. */
  #hotspots{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 250ms var(--ease)}
  #stage.is-overview #hotspots{opacity:1;pointer-events:auto}
  .hot{
    position:absolute;padding:0;cursor:pointer;
    background:transparent;border:2px solid transparent;border-radius:5px;
    transition:border-color 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  .hot span{
    position:absolute;left:-2px;top:-2px;
    min-width:24px;height:24px;line-height:24px;padding:0 6px;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;
    border-radius:5px 0 7px 0;box-shadow:0 1px 5px rgba(0,0,0,.45);
    opacity:0;transform:scale(.7);transform-origin:0 0;
    transition:opacity 180ms var(--ease), transform 180ms var(--ease);
    pointer-events:none;
  }
  .hot:hover,.hot:focus-visible{
    border-color:var(--accent2);
    box-shadow:0 0 0 1px rgba(0,0,0,.35), 0 6px 22px rgba(0,0,0,.45);
    outline:none;z-index:2;
  }
  .hot:hover span,.hot:focus-visible span{opacity:1;transform:scale(1)}

  /* ---------- top bar ---------- */
  #topbar{
    position:absolute;left:0;right:0;top:0;z-index:6;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:linear-gradient(to bottom,rgba(10,12,18,.78),rgba(10,12,18,0));
    pointer-events:none;
  }
  #title{
    font-size:14px;font-weight:700;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,.7);flex:1 1 auto;min-width:0;
  }
  #topbar .btn{pointer-events:auto}

  /* ---------- controls ---------- */
  .btn{
    appearance:none;border:0;background:var(--btn);color:var(--ink);
    height:40px;min-width:40px;padding:0 12px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    font:inherit;font-size:13px;font-weight:650;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background 150ms,transform 120ms,opacity 150ms;
  }
  .btn:hover{background:var(--btn-hover)}
  .btn:active{transform:scale(.95)}
  .btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .btn[disabled]{opacity:.32;cursor:default}
  /* red only while zoomed in — i.e. while pressing it would do something */
  .btn.is-on{background:var(--accent);color:#fff}
  .btn.is-on:hover{background:#e2213a}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn .lbl{display:inline}
  @media (max-width:560px){ .btn .lbl{display:none} .btn{padding:0 10px} }

  /* on the final panel, Next turns into "back to the full page" */
  .ic-full{display:none}
  #app.at-end .ic-next{display:none}
  #app.at-end .ic-full{display:inline-block}
  #app.at-end #next{background:rgba(206,17,38,.75)}
  #app.at-end #next:hover{background:var(--accent)}

  /* side arrows */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:46px;height:64px;border-radius:12px;background:rgba(10,12,18,.45);
  }
  .nav:hover{background:rgba(10,12,18,.7)}
  .nav:active{transform:translateY(-50%) scale(.94)}
  #prev{left:10px}
  #next{right:10px}
  .nav svg{width:24px;height:24px;stroke-width:2.5}
  @media (max-width:560px){ .nav{width:38px;height:54px} #prev{left:6px} #next{right:6px} }

  /* ---------- bottom bar ---------- */
  #bottombar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg2);border-top:1px solid rgba(255,255,255,.07);
  }
  #counter{
    font-size:13px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  #track{
    flex:1 1 auto;height:6px;border-radius:99px;background:rgba(255,255,255,.10);
    position:relative;overflow:hidden;cursor:pointer;min-width:40px;
  }
  #fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width var(--dur) var(--ease);
  }
  #caption{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    max-width:min(90%,640px);z-index:4;
    background:rgba(10,12,18,.82);backdrop-filter:blur(8px);
    padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;
    text-align:center;opacity:0;transition:opacity 300ms var(--ease);pointer-events:none;
  }
  #caption.on{opacity:1}

  /* ---------- states ---------- */
  #msg{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;
    padding:24px;color:var(--muted);font-size:14px;z-index:9;background:var(--bg);
  }
  #msg.on{display:grid}
  #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;color:var(--ink)}
  .spinner{
    width:34px;height:34px;border-radius:50%;margin:0 auto 12px;
    border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent2);
    animation:spin 800ms linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    #canvas,#fill,#spot,#caption,#spot.smooth #spothole{transition-duration:1ms !important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvas">
      <img id="page" alt="">
      <svg id="spot" preserveAspectRatio="none" viewBox="0 0 1000 1000" aria-hidden="true">
        <defs>
          <mask id="spotmask">
            <rect x="0" y="0" width="1000" height="1000" fill="#fff"/>
            <rect id="spothole" x="0" y="0" width="1000" height="1000" rx="6" fill="#000"/>
          </mask>
        </defs>
        <rect x="0" y="0" width="1000" height="1000" fill="rgba(8,10,15,.66)" mask="url(#spotmask)"/>
      </svg>
    </div>

    <div id="hotspots"></div>

    <div id="topbar">
      <div id="title"></div>
      <button class="btn" id="overview" type="button" title="Full page overview (O)" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span class="lbl">Full page</span>
      </button>
      <button class="btn" id="fs" type="button" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <button class="btn nav" id="prev" type="button" title="Previous (←)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn nav" id="next" type="button" title="Next (→)">
      <svg class="ic-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <svg class="ic-full" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>

    <div id="caption"></div>
    <div id="msg"></div>
  </div>

  <div id="bottombar">
    <button class="btn" id="prev2" type="button" title="Previous (←)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="lbl">Back</span>
    </button>
    <div id="track" role="presentation"><div id="fill"></div></div>
    <div id="counter">–</div>
    <button class="btn" id="next2" type="button" title="Next (→)">
      <span class="lbl" id="nextLbl">Next</span>
      <svg class="ic-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <svg class="ic-full" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
  </div>

  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var stage=$("stage"), canvas=$("canvas"), page=$("page"), spot=$("spot"),
      hole=$("spothole"), hotspots=$("hotspots"), titleEl=$("title"),
      captionEl=$("caption"), counter=$("counter"), fill=$("fill"),
      track=$("track"), msg=$("msg"), live=$("live"), ovBtn=$("overview"),
      app=$("app"), nextLbl=$("nextLbl");

  var cfg=null, steps=[], step=0, lastStep=1, base={w:0,h:0}, ready=false;
  // true only when the full page was reached by pressing Next past the last panel,
  // so Back can undo that without offering a jump-to-the-ending on a fresh load
  var cameFromEnd = false;

  var MARGIN = 14;        // px of breathing room around the fitted page
  var EDGE   = 10;        // px the page edge may sit inside the frame before panning stops
  var FULL   = {x:0,y:0,w:1,h:1};

  /* ---------------- config loading ---------------- */

  function showMsg(html){ msg.innerHTML = html; msg.classList.add("on"); }
  function hideMsg(){ msg.classList.remove("on"); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function qs(name){
    var m = new RegExp("[?&]"+name+"=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : null;
  }

  function loadConfig(){
    showMsg('<div><div class="spinner"></div>Loading comic…</div>');
    if (window.COMIC_CONFIG) return Promise.resolve(window.COMIC_CONFIG);

    var inline = qs("config");
    if (inline){
      try { return Promise.resolve(JSON.parse(decodeURIComponent(escape(atob(inline))))); }
      catch(e){ return Promise.reject(new Error("The inline config could not be decoded.")); }
    }
    var url = qs("c") || qs("comic");
    if (!url) return Promise.reject(new Error(
      "No comic specified. Add <code>?c=comics/your-comic.json</code> to the URL."));
    if (/^[a-z]+:\/\//i.test(url) && url.indexOf(location.origin) !== 0)
      return Promise.reject(new Error("Comic config must be a relative path on the same site."));

    return fetch(url, {cache:"default"}).then(function(r){
      if(!r.ok) throw new Error("Could not load <code>"+esc(url)+"</code> ("+r.status+").");
      return r.json();
    });
  }

  function normalize(c){
    if (!c || !c.image) throw new Error("Config is missing an <code>image</code>.");
    c.panels = (c.panels||[]).filter(function(p){
      return p && isFinite(p.x) && isFinite(p.y) && p.w>0 && p.h>0;
    }).map(function(p){
      return { x:clamp(+p.x,0,1), y:clamp(+p.y,0,1),
               w:clamp(+p.w,0.01,1), h:clamp(+p.h,0.01,1), label:p.label||"" };
    });
    if (!c.panels.length) throw new Error("Config has no panels. Map some in <code>mapper.html</code>.");

    c.pad       = isFinite(c.padding)  ? clamp(+c.padding,0,.4) : 0.06;
    c.minZoom   = isFinite(c.minZoom)  ? clamp(+c.minZoom,1,4)  : 1.6;
    c.maxParts  = isFinite(c.maxParts) ? clamp(+c.maxParts,1,4) : 3;
    c.split     = c.split !== false;
    c.spotlight = c.spotlight !== false;
    c.title     = c.title || "";
    c.aspect    = (c.width && c.height) ? (c.width/c.height) : null;
    return c;
  }

  /* ---------------- layout ---------------- */

  function fitBase(){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var ar = cfg.aspect || (page.naturalWidth/page.naturalHeight) || 0.76;
    var availW = Math.max(40, sw - MARGIN*2), availH = Math.max(40, sh - MARGIN*2);
    var w = availW, h = w/ar;
    if (h > availH){ h = availH; w = h*ar; }
    base.w = w; base.h = h;
    canvas.style.width = w+"px";
    canvas.style.height = h+"px";
  }

  // Transform that centres normalized rect r in the stage, then pulls the page back
  // so it never floats away from the frame leaving an empty band.
  function transformFor(r, pad){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var pw = r.w*base.w, ph = r.h*base.h;
    var s = Math.max(Math.min((sw*(1-pad))/pw, (sh*(1-pad))/ph), 0.05);
    var cx = (r.x + r.w/2)*base.w, cy = (r.y + r.h/2)*base.h;
    return {
      s: s,
      tx: axis(sw/2 - s*cx, s*base.w, sw),
      ty: axis(sh/2 - s*cy, s*base.h, sh)
    };
  }
  function axis(t, pageSize, stageSize){
    if (pageSize <= stageSize - EDGE*2) return (stageSize - pageSize)/2;
    return clamp(t, stageSize - pageSize - EDGE, EDGE);
  }

  /* ---------------- steps ----------------
     A panel much wider (or taller) than the frame can only be fitted at roughly
     1:1 — the reader clicks Next and nothing appears to happen. Those panels are
     broken into overlapping sub-frames that sweep across the panel instead, so
     every step visibly moves and no artwork is cropped away. */

  var OVERLAP = 0.18;       // fraction of a sub-frame shared with its neighbour
  var MIN_SPLIT = 0.12;     // panels thinner than this are banners — never split them

  function buildSteps(){
    var keepPanel = steps.length ? steps[Math.max(0,step-1)].panel : 0;
    steps = [];
    cfg.panels.forEach(function(p, pi){
      splitPanel(p).forEach(function(r, si, all){
        steps.push({ r:r, panel:pi, part:si, parts:all.length });
      });
    });
    if (step > 0){
      var i = firstStepOf(keepPanel);
      step = i > 0 ? i : clamp(step, 1, steps.length);
    }
    lastStep = clamp(lastStep, 1, steps.length);
  }

  function splitPanel(p){
    if (!cfg.split) return [p];
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var fitW = sw*(1-cfg.pad), fitH = sh*(1-cfg.pad);
    var pw = p.w*base.w, ph = p.h*base.h;
    if (Math.min(fitW/pw, fitH/ph) >= cfg.minZoom) return [p];   // already zooms enough

    var overW = (pw*cfg.minZoom)/fitW, overH = (ph*cfg.minZoom)/fitH;
    if (overW >= overH && p.h >= MIN_SPLIT) return slice(p, parts(overW), "x");
    if (overH >  overW && p.w >= MIN_SPLIT) return slice(p, parts(overH), "y");
    return [p];
  }

  function parts(over){
    return clamp(Math.ceil((over - OVERLAP)/(1 - OVERLAP)), 1, cfg.maxParts);
  }

  function slice(p, k, ax){
    if (k < 2) return [p];
    var len   = ax==="x" ? p.w : p.h;
    var start = ax==="x" ? p.x : p.y;
    var seg   = len / (k - (k-1)*OVERLAP);
    var adv   = seg * (1 - OVERLAP);
    var out=[];
    for (var i=0;i<k;i++){
      var r = {x:p.x, y:p.y, w:p.w, h:p.h, label:p.label};
      if (ax==="x"){ r.x = start + i*adv; r.w = seg; }
      else         { r.y = start + i*adv; r.h = seg; }
      out.push(r);
    }
    return out;
  }

  function firstStepOf(pi){
    for (var i=0;i<steps.length;i++) if (steps[i].panel === pi) return i+1;
    return 0;
  }

  /* ---------------- rendering ---------------- */

  function apply(animate){
    if (!ready) return;
    var isFull = (step === 0);
    var cur = isFull ? null : steps[step-1];
    var r   = isFull ? FULL : cur.r;
    var t   = transformFor(r, isFull ? 0 : cfg.pad);

    if (animate === false) canvas.style.transition = "none";
    canvas.style.transform = "translate("+t.tx.toFixed(2)+"px,"+t.ty.toFixed(2)+"px) scale("+t.s.toFixed(5)+")";
    if (animate === false){ void canvas.offsetWidth; canvas.style.transition = ""; }

    stage.classList.toggle("is-overview", isFull);
    stage.style.cursor = isFull ? "default" : "zoom-in";

    // Grey while already on the full page, red once there's something to go back from.
    ovBtn.classList.toggle("is-on", !isFull);
    ovBtn.setAttribute("aria-pressed", isFull ? "true" : "false");

    spot.classList.remove("smooth");
    if (cfg.spotlight && !isFull){ setHole(r); spot.classList.add("on"); }
    else spot.classList.remove("on");

    var n = steps.length;
    counter.textContent = isFull ? ("Full page · "+cfg.panels.length+" panels") : (step+" / "+n);
    fill.style.width = (isFull ? 0 : (step/n)*100) + "%";

    var label = isFull ? "" : (cfg.panels[cur.panel].label || "");
    captionEl.textContent = label;
    captionEl.classList.toggle("on", !!label);

    // One more Next at the end returns to the full page, so it is never a dead end.
    var atEnd = (n > 0 && step === n);
    app.classList.toggle("at-end", atEnd);
    nextLbl.textContent = atEnd ? "Full page" : "Next";
    $("next").title = $("next2").title = atEnd ? "Back to the full page (→)" : "Next (→)";

    $("next").disabled = $("next2").disabled = false;
    $("prev").disabled = $("prev2").disabled = (isFull && !cameFromEnd);

    live.textContent = isFull
      ? (cameFromEnd ? "End of the comic. Back to the full page view." : "Full page view")
      : ("Panel "+(cur.panel+1)+" of "+cfg.panels.length
         + (cur.parts>1 ? ", view "+(cur.part+1)+" of "+cur.parts : "")
         + (label ? ": "+label : "")
         + (atEnd ? ". Last panel." : ""));
  }

  function setHole(r){
    hole.setAttribute("x", (r.x*1000).toFixed(2));
    hole.setAttribute("y", (r.y*1000).toFixed(2));
    hole.setAttribute("width",  (r.w*1000).toFixed(2));
    hole.setAttribute("height", (r.h*1000).toFixed(2));
  }

  function go(i, animate, fromEnd){
    cameFromEnd = !!fromEnd;
    step = clamp(i, 0, steps.length);
    if (step > 0) lastStep = step;
    apply(animate);
  }
  function next(){
    if (step < steps.length) go(step+1);
    else go(0, undefined, true);          // past the last panel: back out to the full page
  }
  function prev(){
    if (step > 0) go(step-1);
    else if (cameFromEnd) go(steps.length); // undo that last step back out
  }
  function toggleFull(){ go(step === 0 ? lastStep : 0); }

  /* ---------------- full-page hotspots ---------------- */

  function buildHotspots(){
    hotspots.innerHTML = "";
    var t = transformFor(FULL, 0);
    cfg.panels.forEach(function(p,i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "hot";
      b.style.left   = (t.tx + t.s*p.x*base.w) + "px";
      b.style.top    = (t.ty + t.s*p.y*base.h) + "px";
      b.style.width  = (t.s*p.w*base.w) + "px";
      b.style.height = (t.s*p.h*base.h) + "px";
      b.title = p.label || ("Panel "+(i+1));
      b.setAttribute("aria-label", "Zoom to panel "+(i+1)+(p.label?": "+p.label:""));
      b.innerHTML = "<span>"+(i+1)+"</span>";

      b.addEventListener("pointerenter", function(){ hover(p); });
      b.addEventListener("focus",        function(){ hover(p); });
      b.addEventListener("pointerleave", unhover);
      b.addEventListener("blur",         unhover);
      b.addEventListener("click", function(e){
        e.stopPropagation();
        unhover();
        var s = firstStepOf(i);
        if (s) go(s);
      });
      hotspots.appendChild(b);
    });
  }

  // Hovering a panel in the full-page view dims the rest of the page.
  function hover(p){
    if (step !== 0 || !cfg.spotlight) return;
    spot.classList.add("smooth");
    setHole(p);
    spot.classList.add("on");
  }
  function unhover(){
    if (step !== 0) return;
    spot.classList.remove("on");
  }
  hotspots.addEventListener("pointerleave", unhover);

  /* ---------------- input ---------------- */

  function wire(){
    // Bind on pointerup as well as click: on a trackpad the pointer often drifts a
    // few pixels between press and release, and some browsers then withhold click.
    bindPress($("next"), next);
    bindPress($("prev"), prev);
    bindPress($("next2"), next);
    bindPress($("prev2"), prev);
    bindPress(ovBtn, toggleFull);
    bindPress($("fs"), toggleFullscreen);

    stage.addEventListener("click", function(e){
      if (e.target.closest("button")) return;
      if (dragged) return;
      // Clicking the artwork advances; from the full page it starts the tour.
      if (step === 0) go(1); else next();
    });

    track.addEventListener("click", function(e){
      var r = track.getBoundingClientRect();
      var f = clamp((e.clientX - r.left)/r.width, 0, 1);
      go(Math.max(1, Math.ceil(f*steps.length)));
    });

    window.addEventListener("keydown", function(e){
      if (e.metaKey||e.ctrlKey||e.altKey) return;
      var k = e.key;
      if (k==="ArrowRight"||k==="PageDown"||k===" "||k==="Enter"){ next(); e.preventDefault(); }
      else if (k==="ArrowLeft"||k==="PageUp"){ prev(); e.preventDefault(); }
      else if (k==="Home"){ go(1); e.preventDefault(); }
      else if (k==="End"){ go(steps.length); e.preventDefault(); }
      else if (k==="o"||k==="O"){ toggleFull(); e.preventDefault(); }
      else if (k==="Escape"){ if(step!==0){ go(0); e.preventDefault(); } }
      else if (k==="f"||k==="F"){ toggleFullscreen(); e.preventDefault(); }
    });

    // swipe — ignored when the gesture starts on a control
    var sx=0, sy=0, down=false;
    stage.addEventListener("pointerdown", function(e){
      if (e.button && e.button!==0) return;
      if (e.target.closest("button")) return;
      down=true; dragged=false; sx=e.clientX; sy=e.clientY;
    });
    stage.addEventListener("pointermove", function(e){
      if(!down) return;
      if (Math.abs(e.clientX-sx) > 8 || Math.abs(e.clientY-sy) > 8) dragged = true;
    });
    stage.addEventListener("pointerup", function(e){
      if(!down) return; down=false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.4){
        if (dx < 0) next(); else prev();
        dragged = true;
      }
      setTimeout(function(){ dragged=false; }, 0);
    });
    stage.addEventListener("pointercancel", function(){ down=false; dragged=false; });

    var rt;
    window.addEventListener("resize", function(){
      clearTimeout(rt);
      rt = setTimeout(relayout, 90);
    });
    document.addEventListener("fullscreenchange", function(){ setTimeout(relayout, 60); });
  }
  var dragged = false;

  // One handler, fired by whichever of click/pointerup arrives first.
  function bindPress(el, fn){
    var guard = 0;
    function run(e){
      if (el.disabled) return;
      var now = Date.now();
      if (now - guard < 350) return;
      guard = now;
      e.stopPropagation();
      e.preventDefault();
      fn();
    }
    el.addEventListener("pointerup", run);
    el.addEventListener("click", run);
  }

  function relayout(){
    fitBase();
    buildSteps();
    apply(false);
    buildHotspots();
  }

  function toggleFullscreen(){
    var el = document.documentElement;
    if (!document.fullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
  }

  /* ---------------- boot ---------------- */

  function loadImage(src){
    return new Promise(function(res,rej){
      page.onload  = function(){ res(); };
      page.onerror = function(){ rej(new Error("Could not load the image <code>"+esc(src)+"</code>.")); };
      page.src = src;
    });
  }

  loadConfig()
    .then(function(c){
      cfg = normalize(c);
      titleEl.textContent = cfg.title;
      if (cfg.title) document.title = cfg.title + " – Comic Viewer";
      page.alt = cfg.alt || (cfg.title ? cfg.title + " (full comic page)" : "Comic page");
      return loadImage(cfg.image);
    })
    .then(function(){
      if (!cfg.aspect) cfg.aspect = page.naturalWidth/page.naturalHeight;
      hideMsg();
      ready = true;
      fitBase();
      buildSteps();
      go(0, false);
      buildHotspots();
      wire();

      if (cfg.imageHiRes){
        var hi = new Image();
        hi.onload = function(){ page.src = cfg.imageHiRes; };
        hi.src = cfg.imageHiRes;
      }
      if (cfg.autostart) setTimeout(function(){ go(1); }, 700);
    })
    .catch(function(err){
      showMsg('<div><strong style="color:#fff;display:block;margin-bottom:6px">Comic viewer</strong>'
              + (err && err.message ? err.message : "Something went wrong.") + '</div>');
      console.error(err);
    });
})();
</script>
</body>
</html>
