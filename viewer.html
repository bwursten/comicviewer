<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comic Viewer</title>
<style>
  :root{
    --bg:#12151c;
    --bg2:#1b1f29;
    --ink:#f2f4f8;
    --muted:#9aa3b2;
    --accent:#ce1126;
    --accent2:#ffc72c;
    --btn:rgba(255,255,255,.10);
    --btn-hover:rgba(255,255,255,.20);
    --ui-h:56px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --dur:750ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

  /* ---------- stage ---------- */
  #stage{
    position:relative;flex:1 1 auto;overflow:hidden;
    touch-action:pan-y;
    cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
  }
  #stage.is-overview{cursor:default}
  #canvas{
    position:absolute;left:0;top:0;transform-origin:0 0;
    will-change:transform;
    transition:transform var(--dur) var(--ease);
  }
  #page{
    display:block;width:100%;height:100%;
    border-radius:2px;
    background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.55);
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  #spot{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;opacity:0;transition:opacity 400ms var(--ease);
  }
  #stage:not(.is-overview) #spot.on{opacity:1}

  /* ---------- overview hotspots ---------- */
  #hotspots{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 300ms var(--ease)}
  #stage.is-overview #hotspots{opacity:1;pointer-events:auto}
  .hot{
    position:absolute;border:2px solid rgba(255,199,44,.85);
    border-radius:4px;background:rgba(20,24,34,.18);
    display:flex;align-items:flex-start;justify-content:flex-start;
    padding:0;cursor:pointer;transition:background 150ms,border-color 150ms,transform 150ms;
  }
  .hot:hover,.hot:focus-visible{background:rgba(206,17,38,.30);border-color:#fff;outline:none;z-index:2}
  .hot span{
    display:block;min-width:22px;height:22px;margin:-1px 0 0 -1px;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;
    line-height:22px;text-align:center;border-radius:4px 0 6px 0;
    padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.4);
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:absolute;left:0;right:0;top:0;z-index:5;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:linear-gradient(to bottom,rgba(10,12,18,.78),rgba(10,12,18,0));
    pointer-events:none;
  }
  #title{
    font-size:14px;font-weight:700;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,.7);flex:1 1 auto;min-width:0;
  }
  #topbar .btn{pointer-events:auto}

  /* ---------- controls ---------- */
  .btn{
    appearance:none;border:0;background:var(--btn);color:var(--ink);
    height:40px;min-width:40px;padding:0 12px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    font:inherit;font-size:13px;font-weight:650;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background 150ms,transform 120ms,opacity 150ms;
  }
  .btn:hover{background:var(--btn-hover)}
  .btn:active{transform:scale(.95)}
  .btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .btn[disabled]{opacity:.32;cursor:default}
  .btn.is-on{background:var(--accent);color:#fff}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn .lbl{display:inline}
  @media (max-width:560px){ .btn .lbl{display:none} .btn{padding:0 10px} }

  /* side arrows */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:46px;height:64px;border-radius:12px;background:rgba(10,12,18,.45);
  }
  .nav:hover{background:rgba(10,12,18,.7)}
  #prev{left:10px}
  #next{right:10px}
  .nav svg{width:24px;height:24px;stroke-width:2.5}
  @media (max-width:560px){ .nav{width:38px;height:54px} #prev{left:6px} #next{right:6px} }

  /* ---------- bottom bar ---------- */
  #bottombar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg2);border-top:1px solid rgba(255,255,255,.07);
  }
  #counter{
    font-size:13px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  #track{
    flex:1 1 auto;height:6px;border-radius:99px;background:rgba(255,255,255,.10);
    position:relative;overflow:hidden;cursor:pointer;min-width:40px;
  }
  #fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width var(--dur) var(--ease);
  }
  #caption{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    max-width:min(90%,640px);z-index:4;
    background:rgba(10,12,18,.82);backdrop-filter:blur(8px);
    padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;
    text-align:center;opacity:0;transition:opacity 300ms var(--ease);pointer-events:none;
  }
  #caption.on{opacity:1}

  /* ---------- states ---------- */
  #msg{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;
    padding:24px;color:var(--muted);font-size:14px;z-index:9;background:var(--bg);
  }
  #msg.on{display:grid}
  #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;color:var(--ink)}
  .spinner{
    width:34px;height:34px;border-radius:50%;margin:0 auto 12px;
    border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent2);
    animation:spin 800ms linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    #canvas,#fill,#spot,#caption{transition-duration:1ms !important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvas">
      <img id="page" alt="">
      <svg id="spot" preserveAspectRatio="none" viewBox="0 0 1000 1000" aria-hidden="true">
        <defs>
          <mask id="spotmask">
            <rect x="0" y="0" width="1000" height="1000" fill="#fff"/>
            <rect id="spothole" x="0" y="0" width="1000" height="1000" rx="6" fill="#000"/>
          </mask>
        </defs>
        <rect x="0" y="0" width="1000" height="1000" fill="rgba(8,10,15,.66)" mask="url(#spotmask)"/>
      </svg>
    </div>

    <div id="hotspots"></div>

    <div id="topbar">
      <div id="title"></div>
      <button class="btn" id="overview" type="button" title="Full page overview (O)" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span class="lbl">Full page</span>
      </button>
      <button class="btn" id="fs" type="button" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" id="fsIcon"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <button class="btn nav" id="prev" type="button" title="Previous (←)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn nav" id="next" type="button" title="Next (→)">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <div id="caption"></div>
    <div id="msg"></div>
  </div>

  <div id="bottombar">
    <button class="btn" id="prev2" type="button" title="Previous (←)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="lbl">Back</span>
    </button>
    <div id="track" role="presentation"><div id="fill"></div></div>
    <div id="counter">–</div>
    <button class="btn" id="next2" type="button" title="Next (→)">
      <span class="lbl">Next</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var stage=$("stage"), canvas=$("canvas"), page=$("page"), spot=$("spot"),
      hole=$("spothole"), hotspots=$("hotspots"), titleEl=$("title"),
      captionEl=$("caption"), counter=$("counter"), fill=$("fill"),
      track=$("track"), msg=$("msg"), live=$("live");

  var cfg=null, step=0, lastPanel=1, base={w:0,h:0}, ready=false, lastFocus=null;
  var MARGIN = 14;          // px breathing room around the fitted page
  var DEFAULT_PAD = 0.06;   // fraction of stage kept clear around a zoomed panel

  /* ---------------- config loading ---------------- */

  function showMsg(html){ msg.innerHTML = html; msg.classList.add("on"); }
  function hideMsg(){ msg.classList.remove("on"); }

  function qs(name){
    var m = new RegExp("[?&]"+name+"=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : null;
  }

  function loadConfig(){
    showMsg('<div><div class="spinner"></div>Loading comic…</div>');

    if (window.COMIC_CONFIG) { return Promise.resolve(window.COMIC_CONFIG); }

    var inline = qs("config");
    if (inline) {
      try { return Promise.resolve(JSON.parse(decodeURIComponent(escape(atob(inline))))); }
      catch(e){ return Promise.reject(new Error("The inline config could not be decoded.")); }
    }

    var url = qs("c") || qs("comic");
    if (!url) {
      return Promise.reject(new Error(
        "No comic specified. Add <code>?c=comics/your-comic.json</code> to the URL."));
    }
    // Only same-origin-ish relative paths, to keep embeds predictable.
    if (/^[a-z]+:\/\//i.test(url) && url.indexOf(location.origin) !== 0) {
      return Promise.reject(new Error("Comic config must be a relative path on the same site."));
    }
    return fetch(url, {cache:"default"}).then(function(r){
      if(!r.ok) throw new Error("Could not load <code>"+esc(url)+"</code> ("+r.status+").");
      return r.json();
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function normalize(c){
    if (!c || !c.image) throw new Error("Config is missing an <code>image</code>.");
    c.panels = (c.panels||[]).filter(function(p){
      return p && isFinite(p.x) && isFinite(p.y) && p.w>0 && p.h>0;
    }).map(function(p){
      return {
        x: clamp(+p.x,0,1), y: clamp(+p.y,0,1),
        w: clamp(+p.w,0.01,1), h: clamp(+p.h,0.01,1),
        label: p.label || ""
      };
    });
    if (!c.panels.length) throw new Error("Config has no panels. Map some in <code>mapper.html</code>.");
    c.pad = isFinite(c.padding) ? clamp(+c.padding,0,.4) : DEFAULT_PAD;
    c.spotlight = c.spotlight !== false;
    c.title = c.title || "";
    c.aspect = (c.width && c.height) ? (c.width/c.height) : null;
    return c;
  }

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* ---------------- layout ---------------- */

  function fitBase(){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var ar = cfg.aspect || (page.naturalWidth/page.naturalHeight) || 0.76;
    var availW = Math.max(40, sw - MARGIN*2), availH = Math.max(40, sh - MARGIN*2);
    var w = availW, h = w/ar;
    if (h > availH) { h = availH; w = h*ar; }
    base.w = w; base.h = h;
    canvas.style.width = w+"px";
    canvas.style.height = h+"px";
  }

  // Returns the transform that brings normalized rect r to the centre of the stage,
  // then pulls the page back so it never floats away from the frame. Without the
  // clamp, a full-width panel on a narrow phone screen centres correctly but leaves
  // a large empty band above or below the artwork.
  var EDGE = 10; // px the page edge may sit inside the stage before we stop panning

  function transformFor(r, pad){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var pw = r.w*base.w, ph = r.h*base.h;
    var s = Math.min((sw*(1-pad))/pw, (sh*(1-pad))/ph);
    s = Math.max(s, 0.05);
    var cx = (r.x + r.w/2)*base.w, cy = (r.y + r.h/2)*base.h;
    var tx = sw/2 - s*cx, ty = sh/2 - s*cy;

    var pageW = s*base.w, pageH = s*base.h;
    tx = axis(tx, pageW, sw);
    ty = axis(ty, pageH, sh);
    return { s:s, tx:tx, ty:ty };
  }

  function axis(t, pageSize, stageSize){
    if (pageSize <= stageSize - EDGE*2) return (stageSize - pageSize)/2; // fits: centre it
    return clamp(t, stageSize - pageSize - EDGE, EDGE);                  // overflows: keep edges covered
  }

  var FULL = {x:0,y:0,w:1,h:1};

  function apply(animate){
    if (!ready) return;
    var isOv = (step === 0);
    var r = isOv ? FULL : cfg.panels[step-1];
    var pad = isOv ? 0 : cfg.pad;
    var t = transformFor(r, pad);

    if (animate === false) canvas.style.transition = "none";
    canvas.style.transform = "translate("+t.tx.toFixed(2)+"px,"+t.ty.toFixed(2)+"px) scale("+t.s.toFixed(5)+")";
    if (animate === false) { void canvas.offsetWidth; canvas.style.transition = ""; }

    stage.classList.toggle("is-overview", isOv);
    $("overview").classList.toggle("is-on", isOv);
    $("overview").setAttribute("aria-pressed", isOv ? "true" : "false");

    // spotlight hole (svg viewBox is 0 0 1000 1000, stretched over the page)
    if (cfg.spotlight && !isOv){
      hole.setAttribute("x", (r.x*1000).toFixed(2));
      hole.setAttribute("y", (r.y*1000).toFixed(2));
      hole.setAttribute("width", (r.w*1000).toFixed(2));
      hole.setAttribute("height", (r.h*1000).toFixed(2));
      spot.classList.add("on");
    } else {
      spot.classList.remove("on");
    }

    var n = cfg.panels.length;
    counter.textContent = isOv ? ("Full page · "+n+" panels") : (step+" / "+n);
    fill.style.width = (isOv ? 0 : (step/n)*100) + "%";

    var cap = isOv ? "" : (cfg.panels[step-1].label||"");
    captionEl.textContent = cap;
    captionEl.classList.toggle("on", !!cap);

    var atEnd = step >= n;
    $("prev").disabled = $("prev2").disabled = isOv;
    $("next").disabled = $("next2").disabled = atEnd;

    live.textContent = isOv ? "Full page view" :
      ("Panel "+step+" of "+n+(cap?": "+cap:""));
  }

  function go(i, animate){
    var n = cfg.panels.length;
    step = clamp(i, 0, n);
    if (step > 0) lastPanel = step;
    apply(animate);
  }
  function next(){ if (step < cfg.panels.length) go(step+1); }
  function prev(){ if (step > 0) go(step-1); }
  function toggleOverview(){ go(step === 0 ? lastPanel : 0); }

  /* ---------------- overview hotspots ---------------- */

  function buildHotspots(){
    hotspots.innerHTML = "";
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var t = transformFor(FULL, 0);
    cfg.panels.forEach(function(p,i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "hot";
      b.style.left   = (t.tx + t.s*p.x*base.w) + "px";
      b.style.top    = (t.ty + t.s*p.y*base.h) + "px";
      b.style.width  = (t.s*p.w*base.w) + "px";
      b.style.height = (t.s*p.h*base.h) + "px";
      b.title = p.label || ("Panel "+(i+1));
      b.setAttribute("aria-label", "Jump to panel "+(i+1)+(p.label?": "+p.label:""));
      b.innerHTML = "<span>"+(i+1)+"</span>";
      b.addEventListener("click", function(e){ e.stopPropagation(); go(i+1); });
      hotspots.appendChild(b);
    });
    void sw; void sh;
  }

  /* ---------------- input ---------------- */

  function wire(){
    $("next").addEventListener("click", function(e){ e.stopPropagation(); next(); });
    $("prev").addEventListener("click", function(e){ e.stopPropagation(); prev(); });
    $("next2").addEventListener("click", next);
    $("prev2").addEventListener("click", prev);
    $("overview").addEventListener("click", function(e){ e.stopPropagation(); toggleOverview(); });
    $("fs").addEventListener("click", toggleFullscreen);

    // click the artwork to advance (not while in overview — hotspots own the clicks)
    stage.addEventListener("click", function(e){
      if (step === 0) return;
      if (e.target.closest("button")) return;
      if (dragged) return;
      next();
    });

    // progress bar scrubbing
    track.addEventListener("click", function(e){
      var r = track.getBoundingClientRect();
      var f = clamp((e.clientX - r.left)/r.width, 0, 1);
      go(Math.max(1, Math.ceil(f*cfg.panels.length)));
    });

    // keyboard
    window.addEventListener("keydown", function(e){
      if (e.metaKey||e.ctrlKey||e.altKey) return;
      var k = e.key;
      if (k==="ArrowRight"||k==="PageDown"||k===" "||k==="Enter"){ next(); e.preventDefault(); }
      else if (k==="ArrowLeft"||k==="PageUp"){ prev(); e.preventDefault(); }
      else if (k==="Home"){ go(1); e.preventDefault(); }
      else if (k==="End"){ go(cfg.panels.length); e.preventDefault(); }
      else if (k==="o"||k==="O"){ toggleOverview(); e.preventDefault(); }
      else if (k==="Escape"){ if(step!==0){ go(0); e.preventDefault(); } }
      else if (k==="f"||k==="F"){ toggleFullscreen(); e.preventDefault(); }
    });

    // swipe
    var sx=0, sy=0, down=false;
    stage.addEventListener("pointerdown", function(e){
      if (e.button && e.button!==0) return;
      down=true; dragged=false; sx=e.clientX; sy=e.clientY;
    });
    stage.addEventListener("pointermove", function(e){
      if(!down) return;
      if (Math.abs(e.clientX-sx) > 8 || Math.abs(e.clientY-sy) > 8) dragged = true;
    });
    stage.addEventListener("pointerup", function(e){
      if(!down) return; down=false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.4){
        if (dx < 0) next(); else prev();
        dragged = true;               // suppress the click that follows
        setTimeout(function(){ dragged=false; }, 0);
      } else {
        setTimeout(function(){ dragged=false; }, 0);
      }
    });
    stage.addEventListener("pointercancel", function(){ down=false; dragged=false; });

    var rt;
    window.addEventListener("resize", function(){
      clearTimeout(rt);
      rt = setTimeout(function(){ fitBase(); apply(false); buildHotspots(); }, 90);
    });
    document.addEventListener("fullscreenchange", function(){
      setTimeout(function(){ fitBase(); apply(false); buildHotspots(); }, 60);
    });
  }
  var dragged = false;

  function toggleFullscreen(){
    var el = document.documentElement;
    if (!document.fullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
  }

  /* ---------------- boot ---------------- */

  function loadImage(src){
    return new Promise(function(res,rej){
      page.onload = function(){ res(); };
      page.onerror = function(){ rej(new Error("Could not load the image <code>"+esc(src)+"</code>.")); };
      page.src = src;
    });
  }

  loadConfig()
    .then(function(c){
      cfg = normalize(c);
      titleEl.textContent = cfg.title;
      if (cfg.title) document.title = cfg.title + " – Comic Viewer";
      page.alt = cfg.alt || (cfg.title ? cfg.title + " (full comic page)" : "Comic page");
      return loadImage(cfg.image);
    })
    .then(function(){
      if (!cfg.aspect) cfg.aspect = page.naturalWidth/page.naturalHeight;
      hideMsg();
      ready = true;
      fitBase();
      go(0, false);
      buildHotspots();
      wire();

      // Swap in a higher-resolution file once it's cached, so zoomed panels stay crisp.
      if (cfg.imageHiRes){
        var hi = new Image();
        hi.onload = function(){ page.src = cfg.imageHiRes; };
        hi.src = cfg.imageHiRes;
      }
      // Start on the first panel automatically if the config asks for it.
      if (cfg.autostart) setTimeout(function(){ go(1); }, 700);
    })
    .catch(function(err){
      showMsg('<div><strong style="color:#fff;display:block;margin-bottom:6px">Comic viewer</strong>'
              + (err && err.message ? err.message : "Something went wrong.") + '</div>');
      console.error(err);
    });

  void lastFocus;
})();
</script>
</body>
</html>
